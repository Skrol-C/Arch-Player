# Release builds for the in-app updater.
#
# The updater (lib/features/settings/update_service.dart) reads
#   https://api.github.com/repos/Skrol-C/Arch-Player/releases/latest
# takes `tag_name` as the version (vX.Y.Z, leading v stripped),
# and downloads the FIRST .apk asset it finds.
#
# Flow: bump pubspec.yaml version, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow builds, attaches arm64 first, and publishes the release.
#
# SIGNING (required for OTA updates to install over the sideloaded app):
# add these repo secrets once, from a single keystore you keep forever:
#   ANDROID_KEYSTORE_BASE64  - base64 of your release .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the job still builds, but with the ephemeral debug key,
# and the in-app updater will fail with a signature mismatch.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM + NDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libclang-dev
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      - name: Install NDK r27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Decode keystore (release signing)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -I$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include -I$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/19/include -D__ANDROID_API__=24

      - name: Publish GitHub release (arm64 first — updater takes the first .apk)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
