# Release builds for the in-app updater.
#
# The updater (lib/features/settings/update_service.dart) reads
#   https://api.github.com/repos/Skrol-C/Arch-Player/releases/latest
# takes `tag_name` as the version (vX.Y.Z, leading v stripped),
# and downloads the FIRST .apk asset it finds.
#
# Flow: bump pubspec.yaml version, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow builds, attaches arm64 first, and publishes the release.
#
# SIGNING (required for OTA updates to install over the sideloaded app):
# add these repo secrets once, from a single keystore you keep forever:
#   ANDROID_KEYSTORE_BASE64  - base64 of your release .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the job still builds, but with the ephemeral debug key,
# and the in-app updater will fail with a signature mismatch.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level so steps can branch on key presence without touching
      # the secrets context in `if` (not allowed there).
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM + NDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libclang-dev
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          CLANG_SO=$(find /usr/lib -name 'libclang.so*' 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$(dirname "$CLANG_SO")" >> "$GITHUB_ENV"
          echo "Found libclang at: $CLANG_SO"

      - name: Install NDK r27
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Set bindgen flags (paths expanded by shell, not YAML)
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64
          CLANG_VER=$(ls "$NDK/lib/clang")
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$NDK/sysroot/usr/include -I$NDK/sysroot/usr/include/aarch64-linux-android -I$NDK/lib/clang/$CLANG_VER/include -D__ANDROID_API__=24" >> "$GITHUB_ENV"

      - name: Generate secrets.local.dart (empty keys = quiet lanes)
        env:
          K_LASTFM: ${{ secrets.LASTFM_API_KEY }}
          K_FANART: ${{ secrets.FANART_API_KEY }}
          K_AUDIODB: ${{ secrets.AUDIODB_API_KEY }}
          K_ACOUSTID: ${{ secrets.ACOUSTID_API_KEY }}
          K_GSB: ${{ secrets.GETSONGBPM_API_KEY }}
        run: |
          cat > lib/core/secrets.local.dart << 'DART_EOF'
          // Generated in CI from repo secrets. Empty = lane stays quiet.
          const lastFmApiKey = 'K_LASTFM_PH';
          const fanartApiKey = 'K_FANART_PH';
          const audioDbApiKey = 'K_AUDIODB_PH';
          const acoustIdApiKey = 'K_ACOUSTID_PH';
          const getSongBpmApiKey = 'K_GSB_PH';
          DART_EOF
          python3 - << 'PY_EOF'
          import os
          keys = {
              'K_LASTFM_PH': os.environ.get('K_LASTFM') or 'PASTE_KEY_HERE',
              'K_FANART_PH': os.environ.get('K_FANART') or 'PASTE_KEY_HERE',
              'K_AUDIODB_PH': os.environ.get('K_AUDIODB') or 'PASTE_KEY_HERE',
              'K_ACOUSTID_PH': os.environ.get('K_ACOUSTID') or 'PASTE_KEY_HERE',
              'K_GSB_PH': os.environ.get('K_GSB') or 'PASTE_KEY_HERE',
          }
          p = 'lib/core/secrets.local.dart'
          s = open(p).read()
          for ph, v in keys.items():
              s = s.replace(ph, v)
          open(p, 'w').write(s)
          PY_EOF

      - name: Decode keystore (release signing)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KS_KEYPASS"
          } >> "$GITHUB_ENV"

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
        # BINDGEN_EXTRA_CLANG_ARGS comes from GITHUB_ENV (set + expanded
        # by the shell in "Set bindgen flags" above).

      - name: Publish GitHub release (arm64 first — updater takes the first .apk)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
